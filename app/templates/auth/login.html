<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <title>Login | MedBot AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full space-y-8 bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-white">Welcome Back</h2>
            <p class="mt-2 text-sm text-slate-400">Sign in to your medical assistant</p>
        </div>
        <form class="mt-8 space-y-6" action="/auth/login" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="email" class="text-sm font-medium text-slate-300">Email Address</label>
                    <input id="email" name="email" type="email" required class="mt-1 block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label for="password" class="text-sm font-medium text-slate-300">Password</label>
                    <input id="password" name="password" type="password" required class="mt-1 block w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Sign in
                </button>
            </div>
        </form>
        <div class="text-center">
            <p class="text-sm text-slate-400">Don't have an account? <a href="/auth/register" class="font-medium text-indigo-400 hover:text-indigo-300">Register here</a></p>
        </div>
    </div>
</body>
</html>
