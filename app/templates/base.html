<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else "Medical Chatbot v2" }}</title>
    <meta name="description" content="MedBot AI — Your AI-powered medical assistant with RAG-based answers and source citations.">

    <!-- Open Graph -->
    <meta property="og:title" content="MedBot AI — Your AI Medical Assistant">
    <meta property="og:description" content="Get instant, evidence-based medical answers powered by RAG technology.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://harshmedbot.duckdns.org/">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🏥</text></svg>">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
                        dark: '#0F172A',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-light dark:bg-dark text-slate-900 dark:text-slate-100 font-sans" x-data="{ darkMode: false, sidebarOpen: true }" :class="{ 'dark': darkMode }">
    <div class="flex h-full overflow-hidden">
        <!-- Sidebar -->
        <aside class="fixed inset-y-0 left-0 z-50 w-64 glass transition-transform duration-300 lg:translate-x-0 lg:static lg:inset-0"
               :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="flex flex-col h-full">
                <div class="flex items-center justify-between p-6">
                    <a href="/dashboard" class="text-2xl font-bold text-indigo-500 hover:text-indigo-400 transition-colors">MedBot AI</a>
                    <button @click="sidebarOpen = false" class="lg:hidden p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg">
                        <i data-lucide="x"></i>
                    </button>
                </div>

                <nav class="flex-1 px-4 space-y-2 overflow-y-auto custom-scrollbar">
                    <a href="/dashboard" class="flex items-center space-x-3 p-3 rounded-xl transition-all duration-200 hover:bg-slate-200 dark:hover:bg-slate-800 {{ 'bg-indigo-500/10 text-indigo-500' if request.url.path == '/dashboard' else '' }}">
                        <i data-lucide="layout-dashboard"></i>
                        <span class="font-medium">Dashboard</span>
                    </a>
                    <a href="/chat" class="flex items-center space-x-3 p-3 rounded-xl transition-all duration-200 hover:bg-slate-200 dark:hover:bg-slate-800 {{ 'bg-indigo-500/10 text-indigo-500' if request.url.path == '/chat' else '' }}">
                        <i data-lucide="message-square"></i>
                        <span class="font-medium">AI Chat</span>
                    </a>
                    <a href="/intake" class="flex items-center space-x-3 p-3 rounded-xl transition-all duration-200 hover:bg-slate-200 dark:hover:bg-slate-800 {{ 'bg-indigo-500/10 text-indigo-500' if request.url.path == '/intake' else '' }}">
                        <i data-lucide="clipboard-list"></i>
                        <span class="font-medium">Patient Intake</span>
                    </a>
                </nav>

                <div class="p-4 border-t border-slate-200 dark:border-slate-800">
                    <div class="flex items-center space-x-3 p-3 glass rounded-2xl">
                        <div class="h-10 w-10 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold">
                            {{ user.name[0] if user else 'U' }}
                        </div>
                        <div class="flex-1 truncate">
                            <p class="text-sm font-semibold truncate">{{ user.name if user else 'User' }}</p>
                            <a href="/auth/logout" class="text-xs text-red-400 hover:text-red-300 transition-colors">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Header -->
            <header class="flex items-center justify-between p-4 glass lg:px-8">
                <div class="flex items-center space-x-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg">
                        <i data-lucide="menu"></i>
                    </button>
                    <h1 class="text-xl font-bold">{% block page_title %}{% endblock %}</h1>
                </div>

                <div class="flex items-center space-x-4">
                    <button @click="darkMode = !darkMode" class="p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg transition-colors">
                        <i x-show="!darkMode" data-lucide="moon"></i>
                        <i x-show="darkMode" data-lucide="sun"></i>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
